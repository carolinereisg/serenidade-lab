<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Carrossel — Como usar sua criatividade ao seu favor</title>
<link rel="stylesheet" href="fontes.css">
<style>
  :root{
    --roxo-escuro:#2D0A4E;
    --roxo-medio:#5B2D8E;
    --roxo-claro:#8B5CC8;
    --roxo-suave:#C4A8E8;
    --laranja:#F5630A;
    --laranja-claro:#FF8C42;
    --creme:#FDF8F2;
    --branco:#FFFFFF;
    --trilho:#EBDED0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#171226;font-family:'DM Sans',system-ui,sans-serif;color:var(--roxo-escuro)}

  /* ---------- galeria (visualização) ---------- */
  .galeria{display:flex;flex-wrap:wrap;gap:34px;padding:44px;justify-content:center}
  .moldura{width:432px}
  .palco{width:432px;height:540px;overflow:hidden;border-radius:6px;box-shadow:0 18px 44px rgba(0,0,0,.42)}
  .palco .slide{transform:scale(.4);transform-origin:0 0}
  .legenda{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9c8fb5;margin-top:10px}

  /* ---------- o slide: 1080 x 1350 (4:5) ---------- */
  .slide{
    position:relative;width:1080px;height:1350px;flex:none;overflow:hidden;
    background:
      radial-gradient(680px 520px at 108% -6%, rgba(196,168,232,.30), transparent 62%),
      radial-gradient(560px 460px at -12% 104%, rgba(245,99,10,.10), transparent 60%),
      var(--creme);
    display:flex;flex-direction:column;
  }

  /* barra de progressão contínua */
  .progresso{position:absolute;top:0;left:0;right:0;height:10px;background:var(--trilho);z-index:3}
  .progresso i{display:block;height:100%;background:linear-gradient(90deg,var(--laranja-claro),var(--laranja));border-radius:0 6px 6px 0}

  .cabecalho{display:flex;justify-content:space-between;align-items:baseline;padding:74px 86px 0}
  .marca,.contador{font-family:'DM Mono',monospace;font-size:19px;letter-spacing:.22em;text-transform:uppercase}
  .marca{color:var(--laranja)}
  .contador{color:var(--roxo-claro)}

  .corpo{flex:1;display:flex;flex-direction:column;justify-content:center;padding:34px 86px;min-height:0}
  .conteudo{font-size:30px}
  .conteudo p{font-size:1em;line-height:1.52;color:#3A1560;margin-bottom:.78em;letter-spacing:.002em}
  .conteudo p:last-child{margin-bottom:0}

  .numero{font-family:'Playfair Display',serif;font-weight:900;font-size:3.5em;line-height:.82;color:var(--laranja);margin-bottom:.16em;letter-spacing:-.02em}
  .numero small{font-family:'DM Mono',monospace;font-weight:400;font-size:.24em;letter-spacing:.2em;color:var(--roxo-claro);display:block;margin-top:.7em}
  .titulo-ponto{font-family:'Playfair Display',serif;font-weight:700;font-size:1.72em;line-height:1.14;color:var(--roxo-escuro);margin-bottom:.62em;letter-spacing:-.01em}
  .risco{width:2.6em;height:5px;background:var(--laranja);border-radius:3px;margin-bottom:.9em}

  .destaque{font-family:'Playfair Display',serif;font-style:italic;font-size:1.42em;line-height:1.3;color:var(--roxo-medio);
    border-left:6px solid var(--laranja);padding-left:.7em;margin-top:.9em}
  .fecho-destaque{font-family:'Playfair Display',serif;font-weight:700;font-size:2.05em;line-height:1.18;color:var(--roxo-escuro);margin-bottom:.7em;letter-spacing:-.012em}
  .fecho-destaque em{font-style:italic;color:var(--laranja)}

  .rodape{display:flex;justify-content:space-between;align-items:center;padding:0 86px 68px;
    font-family:'DM Mono',monospace;font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:#8B7BA5}
  .rodape .arrasta{color:var(--laranja);display:flex;align-items:center;gap:10px}

  /* ---------- capa ---------- */
  .capa .corpo{justify-content:flex-end;padding-bottom:20px}
  .capa .eyebrow{font-family:'DM Mono',monospace;font-size:21px;letter-spacing:.3em;text-transform:uppercase;color:var(--laranja);margin-bottom:30px}
  .capa h1{font-family:'Playfair Display',serif;font-weight:900;font-size:104px;line-height:1.01;letter-spacing:-.028em;color:var(--roxo-escuro)}
  .capa h1 em{font-style:italic;color:var(--laranja);font-weight:700}
  .capa .sub{font-size:30px;line-height:1.42;color:var(--roxo-medio);margin-top:38px;max-width:15.6em}
  .capa .risco{width:132px;height:7px;margin:44px 0 0}
  .capa .autoria{font-family:'DM Mono',monospace;font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:var(--roxo-claro);margin-top:34px;line-height:1.9}
  .capa .autoria b{color:var(--roxo-escuro);font-weight:500}
  .bolha{position:absolute;border-radius:50%;z-index:0}
  .b1{width:300px;height:300px;right:-70px;top:170px;background:rgba(139,92,200,.13)}
  .b2{width:150px;height:150px;right:150px;top:430px;background:rgba(245,99,10,.14)}

  /* ---------- cta ---------- */
  .cta .corpo{justify-content:center;text-align:center;align-items:center}
  .cta .eyebrow{font-family:'DM Mono',monospace;font-size:21px;letter-spacing:.3em;text-transform:uppercase;color:var(--laranja);margin-bottom:34px}
  .cta h2{font-family:'Playfair Display',serif;font-weight:900;font-size:70px;line-height:1.06;letter-spacing:-.022em;max-width:14em;margin-bottom:40px}
  .cta h2 em{font-style:italic;color:var(--laranja);font-weight:700}
  .cta p{font-size:31px;line-height:1.5;color:var(--roxo-medio);max-width:17.5em;margin-bottom:16px}
  .cta .botao{margin-top:46px;background:linear-gradient(135deg,var(--laranja),#E8450A);color:#fff;
    font-family:'DM Mono',monospace;font-size:23px;letter-spacing:.22em;padding:26px 54px;border-radius:100px;
    box-shadow:0 16px 34px rgba(245,99,10,.3)}
  .cta .autoria{font-family:'DM Mono',monospace;font-size:20px;letter-spacing:.18em;text-transform:uppercase;color:var(--roxo-claro);margin-top:44px}

  /* ---------- modo exportação ---------- */
  body.raw{background:#fff}
  body.raw .galeria{display:block;padding:0}
  body.raw .moldura{width:1080px}
  body.raw .palco{width:1080px;height:1350px;border-radius:0;box-shadow:none}
  body.raw .palco .slide{transform:none}
  body.raw .legenda{display:none}
</style>
</head>
<body>
<div class="galeria" id="galeria"></div>

<script src="conteudo.js"></script>
<script>
const TOTAL = SLIDES.length;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const par = ps => (ps||[]).map(p => `<p>${esc(p)}</p>`).join('');
const pad = n => String(n).padStart(2,'0');

function cromo(s){
  const pct = (s.n / TOTAL) * 100;
  return {
    barra: `<div class="progresso"><i style="width:${pct.toFixed(4)}%"></i></div>`,
    topo: `<div class="cabecalho"><div class="marca">Serenidade Lab</div><div class="contador">${pad(s.n)} / ${TOTAL}</div></div>`,
    pe: `<div class="rodape"><div>Caroline Reis</div>${ s.n < TOTAL ? '<div class="arrasta">arraste &rarr;</div>' : '<div class="arrasta">fim</div>' }</div>`
  };
}

function monta(s){
  const c = cromo(s);
  let miolo = '';

  if (s.tipo === 'capa') {
    const t = esc(s.titulo).replace('criatividade','<em>criatividade</em>');
    miolo = `<div class="corpo">
      <div class="eyebrow">${esc(s.eyebrow)}</div>
      <h1>${t}</h1>
      <div class="risco"></div>
      <div class="sub">${esc(s.subtitulo)}</div>
      <div class="autoria"><b>${esc(s.assinatura)}</b><br>10 reflex&otilde;es &middot; ${TOTAL} slides</div>
    </div>`;
    return `<div class="slide capa">${c.barra}<div class="bolha b1"></div><div class="bolha b2"></div>${c.topo}${miolo}${c.pe}</div>`;
  }

  if (s.tipo === 'cta') {
    const t = esc(s.titulo).replace('criatividade','<em>criatividade</em>');
    miolo = `<div class="corpo">
      <div class="eyebrow">${esc(s.eyebrow)}</div>
      <h2>${t}</h2>
      ${s.linhas.map(l => `<p>${esc(l)}</p>`).join('')}
      <div class="botao">${esc(s.botao)}</div>
    </div>`;
    return `<div class="slide cta">${c.barra}${c.topo}${miolo}${c.pe}</div>`;
  }

  if (s.tipo === 'ponto') {
    const num = s.continuacao
      ? `<div class="numero">${esc(s.numero)}<small>continua&ccedil;&atilde;o</small></div>`
      : `<div class="numero">${esc(s.numero)}</div>`;
    const tit = s.titulo ? `<div class="titulo-ponto">${esc(s.titulo)}</div>` : '<div class="risco"></div>';
    miolo = `<div class="corpo"><div class="conteudo">${num}${tit}${par(s.paragrafos)}</div></div>`;
    return `<div class="slide">${c.barra}${c.topo}${miolo}${c.pe}</div>`;
  }

  if (s.tipo === 'fecho') {
    const d = esc(s.destaque).replace('Waiha.','<em>Waiha.</em>');
    miolo = `<div class="corpo"><div class="conteudo"><div class="risco"></div><div class="fecho-destaque">${d}</div>${par(s.paragrafos)}</div></div>`;
    return `<div class="slide">${c.barra}${c.topo}${miolo}${c.pe}</div>`;
  }

  const extra = s.destaque ? `<div class="destaque">${esc(s.destaque)}</div>` : '';
  miolo = `<div class="corpo"><div class="conteudo">${par(s.paragrafos)}${extra}</div></div>`;
  return `<div class="slide">${c.barra}${c.topo}${miolo}${c.pe}</div>`;
}

// ---- render ----
const q = new URLSearchParams(location.search);
const alvo = q.get('slide');
if (q.get('raw') === '1') document.body.classList.add('raw');

const lista = alvo ? SLIDES.filter(s => String(s.n) === String(alvo)) : SLIDES;
document.getElementById('galeria').innerHTML = lista.map(s =>
  `<div class="moldura"><div class="palco">${monta(s)}</div><div class="legenda">slide ${pad(s.n)} / ${TOTAL}</div></div>`
).join('');

// ---- auto-ajuste tipográfico: maior corpo de texto que ainda cabe ----
function ajusta(){
  const FOLGA = 26; // respiro minimo antes do rodape
  document.querySelectorAll('.slide .corpo').forEach(corpo => {
    const cont = corpo.querySelector('.conteudo');
    if (!cont) return;
    const cs = getComputedStyle(corpo);
    const util = corpo.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - FOLGA;
    let ok = 17;
    for (let fs = 38; fs >= 17; fs -= 0.5) {
      cont.style.fontSize = fs + 'px';
      if (cont.scrollHeight <= util) { ok = fs; break; }
    }
    cont.style.fontSize = ok + 'px';
    cont.dataset.fs = ok;
  });
  document.documentElement.dataset.pronto = '1';
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajusta); else window.addEventListener('load', ajusta);
</script>
</body>
</html>
